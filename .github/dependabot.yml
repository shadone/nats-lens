# Weekly version updates. The 7-day cooldown matches min-release-age in
# web/.npmrc, so a proposed version can be installed with npm install.
# Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
