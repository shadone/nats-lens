# Fuzzes every Go fuzz target once a week and on demand, with
# scripts/fuzz.sh: 5 minutes per target by default. A failing input fails
# the run and is kept as an artifact; add it under the package's
# testdata/fuzz/<name>/ with a regression test and a fix. The corpus the
# fuzzer builds is cached between runs. docs/operations/go-test-tiers.md
# describes it.
name: Fuzz

on:
  schedule:
    - cron: '41 4 * * 2'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target, in go test -fuzztime syntax
        default: 5m

permissions:
  contents: read

jobs:
  fuzz:
    name: Go fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The fuzzer keeps the inputs that reached new code under
      # GOCACHE/fuzz; restoring them lets each run start where the last
      # one stopped.
      - name: Find the fuzz cache
        id: cache
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache.outputs.dir }}
          key: fuzz-${{ github.run_id }}
          restore-keys: fuzz-
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '5m' }}
          FUZZ_PARALLEL: 4
        run: scripts/fuzz.sh "$FUZZTIME"
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures
          path: internal/**/testdata/fuzz/
          retention-days: 30
