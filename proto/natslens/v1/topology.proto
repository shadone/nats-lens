syntax = "proto3";

package natslens.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "natslens/v1/common.proto";

option go_package = "github.com/shadone/nats-lens/internal/gen/natslens/v1;natslensv1";

// Request for how the servers of a system connect.
message GetTopologyRequest {
  // System ID, as ListSystems returns it. Empty means the default system.
  string system = 1;

  // Range whose newest epoch is read; drops are counted over the 24 hours
  // before that epoch. Unset means the last 24 hours up to now.
  TimeRange range = 2;
}

// One server of a cluster.
message TopologyServer {
  // Server name.
  string name = 1;

  // Whether the server was expected and answered no request in the epoch.
  bool missing = 2;

  // Whether the server is the JetStream meta leader.
  bool meta_leader = 3;

  // Resident memory of the server process (VARZ mem), bytes; unset when
  // not reported and for a missing server.
  optional int64 mem_bytes = 4;

  reserved 5;
  reserved "mem_high";

  // JetStream memory store in use and its limit (max_memory_store),
  // bytes; unset when not reported.
  optional int64 js_memory_bytes = 6;
  optional int64 js_max_memory_bytes = 7;

  // The finding about the server's memory that fires in the epoch:
  // server-008 (memory far above the other servers), else server-007 when
  // the JetStream memory store is at least as full as the file store.
  // Empty when none fires.
  string memory_finding_id = 8;

  // Check code of that finding.
  string memory_finding_code = 9;

  // Severity of that finding.
  Severity memory_finding_severity = 10;

  // Whether that finding is muted or accepted.
  bool memory_finding_quiet = 11;

  // Whether the mute of that finding is an acceptance as by design.
  bool memory_finding_accepted = 12;
}

// One cluster of a system: its servers and what sits on it.
message TopologyCluster {
  // Cluster name. Empty for the servers whose cluster is not known: they
  // have no stored identity, and no route of a server with a known
  // cluster names them.
  string name = 1;

  // The value of the region: tag every server of the cluster carries;
  // empty when they carry none or differ.
  string place = 2;

  // The servers expected in the epoch, by name.
  repeated TopologyServer servers = 3;

  // Whether the JetStream meta leader is a server of the cluster.
  bool meta_leader = 4;

  // Streams the cluster's servers lead; unset when no server reports it.
  optional int32 streams_led = 5;

  // Leaf node sites, by name, connected to the cluster's servers now;
  // unset when no server of the cluster answered LEAFZ.
  optional int32 leafnodes_connected = 6;

  // Leaf node sites, by name, last seen on the cluster in the 24 hours
  // and not connected now, without those whose state is not known
  // (connection_unknown); unset when no server of the cluster answered
  // LEAFZ.
  optional int32 leafnodes_not_connected = 7;
}

// The gateway connections between two clusters: every two clusters with a
// gateway row in the epoch or an outbound gateway in the 24 hours before,
// so a pair that is down in the epoch is listed with 0 connections.
message TopologyGateway {
  // The two clusters, in name order.
  string cluster_a = 1;
  string cluster_b = 2;

  // Outbound gateway connections up now, from either cluster to the
  // other.
  int32 connections = 3;

  // Outbound connections expected: one from each server of either cluster
  // that answered GATEWAYZ.
  int32 expected = 4;

  // The highest round trip time of the connections up now; unset when
  // none reports one.
  google.protobuf.Duration rtt_max = 5;

  // The median round trip time of the connections up now; unset when none
  // reports one.
  google.protobuf.Duration rtt_median = 6;

  // Bytes waiting to be written on the pair's connections, both
  // directions; unset when none reports it.
  optional int64 pending_bytes = 7;

  // Outbound connections that dropped in the last hour before the epoch;
  // unset when no two consecutive collections in that hour were answered
  // by a server of the pair.
  optional int32 drops_1h = 8;

  // Outbound connections that dropped in the 24 hours before the epoch
  // (from drops_window_start); unset as drops_1h.
  optional int32 drops_24h = 9;

  // Servers whose outbound connection of the pair dropped in the last
  // hour, by name.
  repeated string dropping_servers = 10;
}

// The routes between two servers of a cluster.
message TopologyRoute {
  // Cluster name.
  string cluster = 1;

  // The two servers, in name order.
  string server_a = 2;
  string server_b = 3;

  // The highest round trip time of the pair's routes, as either end
  // reports; unset when not reported.
  google.protobuf.Duration rtt = 4;

  // Bytes waiting to be written on the pair's routes, both ends summed;
  // unset when not reported.
  optional int64 pending_bytes = 5;

  // Pooled routes (routes without an account), the larger count of the
  // two ends; unset when every route of the pair is pinned to an account.
  optional int32 pool = 6;

  // Accounts with a route of their own between the pair, sorted.
  repeated string pinned_accounts = 7;

  // Whether one end reports the pair and the other, which answered
  // ROUTEZ, does not.
  bool one_sided = 8;

  // Whether the route stands out. Servers are near when their round trip
  // is under 2 ms or under 3 times the median of each server's fastest
  // round trip; servers joined by near pairs form groups. Only when the
  // largest group holds more than half of the servers with a reported
  // round trip is the cluster judged: a route of a server outside that
  // group is slow, and a route inside it is slow at 2 ms or more and 3
  // times the median of at least 2 of the group's routes that touch
  // neither of its servers. A cluster split into groups of similar size,
  // or of two servers, has nothing slow. A route is slow only when the
  // epoch and the collection before it (the newest earlier one with
  // routes, at most 3 collect intervals earlier) both measure it slow;
  // without such a collection, or when that one did not measure the
  // pair, it is not slow.
  bool slow = 9;

  // The ends that report the pair, by name.
  repeated string reported_by = 10;

  // Collections in the last hour before the epoch in which a route of the
  // pair dropped: a connection one end listed was gone in the next
  // collection, at most 3 collect intervals later, while both ends
  // answered ROUTEZ both times under the same server IDs. One count per
  // collection, however many of the pair's routes (pooled or pinned)
  // went; unset when no two such collections in that hour listed a route
  // of the pair.
  optional int32 drops_1h = 11;

  // As drops_1h, over the 24 hours before the epoch (from
  // drops_window_start).
  optional int32 drops_24h = 12;

  // Whether the pair is down: the servers of a cluster form a full mesh,
  // and both ends, of one cluster and JetStream domain, answered ROUTEZ in
  // the epoch and in the collection before it under the same server IDs,
  // neither lists the other in either collection, and the pair had a
  // route in the 24 hours before the epoch, or both list routes in the
  // two collections and are joined through them. rtt, pending_bytes and
  // pool are unset.
  bool down = 13;
}

// One leaf node site: a remote server connected to a hub server of the
// system, in one account.
message TopologyLeafnode {
  // Server name of the remote leaf node; its IP address when it reports
  // no name.
  string name = 1;

  // Account the connection is bound to.
  string account = 2;

  // Readable name of the account; empty when none is known.
  string account_name = 3;

  // Hub server now, or the last hub of a site not connected.
  string hub_server = 4;

  // Cluster of the hub server.
  string hub_cluster = 5;

  // Whether the site is connected in the epoch.
  bool connected = 6;

  // Round trip time; unset when not reported and for a site not
  // connected.
  google.protobuf.Duration rtt = 7;

  // Subscriptions over the connection; unset when not reported and for a
  // site not connected.
  optional int64 subscriptions = 8;

  // Times the site's connection dropped in the 24 hours before the epoch;
  // unset when no two consecutive collections were answered by its hub
  // while it was connected.
  optional int32 drops_24h = 9;

  // When a site not connected was last seen; unset for a connected one.
  google.protobuf.Timestamp last_seen = 10;

  // Compression mode; empty when not reported.
  string compression = 11;

  // Every hub server the site is connected to now, by name; hub_server is
  // the first. Empty for a site not connected.
  repeated string hub_servers = 12;

  // Whether a site not connected may be connected after all: a server of
  // the cluster it was last seen on failed LEAFZ in the epoch (see
  // unobserved), and the site may be on it.
  bool connection_unknown = 13;
}

// A stream that mirrors or sources a stream placed in another cluster of
// the system, in the epoch. Origins in another account or JetStream
// domain (external), and origins no server reports, are not listed.
message TopologyReplication {
  // Account of both streams.
  string account = 1;

  // Readable name of the account; empty when none is known.
  string account_name = 2;

  // The stream that copies, and the cluster it is placed in.
  string stream = 3;
  string cluster = 4;

  // The stream it copies from, and that stream's cluster.
  string origin_stream = 5;
  string origin_cluster = 6;

  // "mirror" or "source".
  string kind = 7;

  // Server that leads the copying stream; empty when it has no leader in
  // the epoch, and then lag and activity are unset.
  string leader = 8;

  // Messages the copy is behind its origin, as its leader reports; unset
  // when not reported.
  optional int64 lag = 9;

  // The lag in the collection before the epoch (the newest earlier one
  // with stream reports, at most 3 collect intervals earlier); unset
  // without one.
  optional int64 lag_before = 10;

  // Time since the copy last heard from its origin, data or heartbeat;
  // unset when not reported or never heard.
  google.protobuf.Duration last_active = 11;

  // Whether the leader reports that it never heard from the origin.
  bool never_heard = 12;

  // Error the leader reports for the copy; empty without one.
  string error = 13;

  reserved 14, 15;
  reserved "not_active", "falling_behind";

  // The source's identity (a hash of its configuration), to tell two
  // sources of one origin apart; empty for a mirror.
  string source_id = 16;

  // The subject filter of the source or mirror; empty without one.
  string filter_subject = 17;

  // The finding about the copy that fires in the epoch: for a mirror
  // stream-017 (error), else stream-015 (lagging or not hearing); for a
  // source stream-023 (error), else stream-022 (not hearing), when the
  // finding names this source or names none. Empty when none fires.
  string finding_id = 18;

  // Check code, severity and detail of that finding.
  string finding_code = 19;
  Severity finding_severity = 20;
  string finding_detail = 21;

  // Whether that finding is muted or accepted.
  bool finding_quiet = 22;

  // Whether the mute of that finding is an acceptance as by design.
  bool finding_accepted = 23;
}

// Servers whose reply to one monitoring request is missing or in error in
// the epoch; their links of that kind are left out rather than drawn as
// down.
message TopologyUnobserved {
  // ROUTEZ, GATEWAYZ or LEAFZ.
  string endpoint = 1;

  // Server names, sorted.
  repeated string servers = 2;
}

// How the servers of a system connect, in the range's newest epoch.
message GetTopologyResponse {
  // Epoch read; 0 when the range holds none, and then everything else is
  // empty.
  int64 epoch = 1;

  // When the epoch started.
  google.protobuf.Timestamp epoch_at = 2;

  // Clusters by name.
  repeated TopologyCluster clusters = 3;

  // Gateway pairs: those with no connection of the ones expected first,
  // then most drops in the last hour, then most connections missing,
  // then highest round trip time.
  repeated TopologyGateway gateways = 4;

  // Routes, pairs that are down first, then slow ones, then by round trip
  // time, highest first.
  // Round trips of 0 (sent before the first ping) count as not reported.
  repeated TopologyRoute routes = 5;

  // Leaf node sites, worst first: not connected, then those whose state is
  // not known, then most drops, then highest round trip time, then by
  // name. At most 500.
  repeated TopologyLeafnode leafnodes = 6;

  // Leaf node sites before the limit of 500.
  int32 leafnodes_total = 7;

  // Endpoints that did not answer on some servers, in the order ROUTEZ,
  // GATEWAYZ, LEAFZ; servers that answered nothing are missing instead.
  repeated TopologyUnobserved unobserved = 8;

  // Start of the time drops are counted over: the oldest collection read,
  // later than 24 hours before the epoch when the history is shorter.
  google.protobuf.Timestamp drops_window_start = 9;

  // Time between collections: a drop and reconnect within one is seen
  // only as a new connection ID.
  google.protobuf.Duration collect_interval = 10;

  // Mirrors and sources between clusters: those with a finding that is
  // not muted or accepted first, then by cluster, stream and origin.
  repeated TopologyReplication replication = 11;
}
