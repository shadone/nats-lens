syntax = "proto3";

package natslens.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "natslens/v1/common.proto";
import "natslens/v1/findings.proto";
import "natslens/v1/overview.proto";
import "natslens/v1/servers.proto";

option go_package = "github.com/shadone/nats-lens/internal/gen/natslens/v1;natslensv1";

// One NATS system nats-lens observes.
message SystemRef {
  // System ID, unique in this nats-lens; the value of the system field of
  // every request.
  string id = 1;

  // Display name.
  string name = 2;

  // Environment, as configured, for example production; free text.
  string environment = 3;
}

// Request for the systems nats-lens observes.
message ListSystemsRequest {
  // Range the summaries cover. Unset means the last 24 hours up to now.
  TimeRange range = 1;

  // Number of buckets in each summary's status strip, at most 500. Zero
  // means 48.
  int32 strip_buckets = 2;
}

// What a system's collector is doing.
enum CollectionState {
  // Not known: the system has no collector status and no stored
  // connection event that says otherwise.
  COLLECTION_STATE_UNSPECIFIED = 0;
  // The collector has started and has not yet written an epoch.
  COLLECTION_STATE_STARTING = 1;
  // The collector writes epochs.
  COLLECTION_STATE_COLLECTING = 2;
  // The collector's connection has no server.
  COLLECTION_STATE_NOT_CONNECTED = 3;
  // NATS closed the collector's connection, for example after repeated
  // authorization errors; the collector dials again.
  COLLECTION_STATE_CONNECTION_CLOSED = 4;
  // The data is the demo scenario; nothing is collected.
  COLLECTION_STATE_DEMO = 5;
}

// Summary of one system.
//
// Every number comes from data already collected: the newest epoch in the
// range for the counts, the findings as the range's end sees them. A count
// is unset when the range holds no epoch.
message SystemSummary {
  // The system.
  SystemRef system = 1;

  // What the system's collector is doing now.
  CollectionState collection = 2;

  // Newest error of the collector's connection while it is not collecting;
  // empty while it collects.
  string collection_error = 3;

  // When the collection error began.
  google.protobuf.Timestamp collection_error_since = 4;

  // Newest epoch in the range and its age.
  Freshness freshness = 5;

  // Worst status of the findings that fire at the range's end; no data
  // when the range holds no epoch.
  Status status = 6;

  // Worst unmuted finding that fires at the range's end.
  Finding worst_finding = 7;

  // Findings by severity, as the overview counts them.
  FindingTally tally = 8;

  // Servers expected to answer in the newest epoch.
  optional int32 servers = 9;

  // Servers that answered in the newest epoch.
  optional int32 servers_answering = 10;

  // Distinct cluster names of the servers of the newest epoch; zero for
  // servers without a cluster.
  optional int32 clusters = 11;

  // Streams in the newest epoch.
  optional int32 streams = 12;

  // Client connections across servers in the newest epoch.
  optional int64 connections = 13;

  // Worst status per bucket over the range, oldest first: the worst cell
  // of the status timeline's rows in each bucket.
  repeated Status strip = 14;

  // Start of the strip's first bucket.
  google.protobuf.Timestamp strip_start = 15;

  // Width of each strip bucket.
  google.protobuf.Duration strip_bucket = 16;

  // Why the summary could not be read, for example a timeout; the other
  // fields are then unset. Empty when the summary was read.
  string error = 17;
}

// The systems, in configuration order.
message ListSystemsResponse {
  // The systems.
  repeated SystemSummary systems = 1;

  // Range the summaries cover.
  TimeRange range = 2;

  // ID of the default system: the one a request with an empty system
  // reads.
  string default_system = 3;
}

// One account of a system.
message Account {
  // Account as the servers report it (the account ID in operator mode).
  string account = 1;

  // Readable name of the account, when known.
  string account_name = 2;

  // Whether this is the system account.
  bool is_system = 3;

  // Client connections in the account in the newest epoch; unset when not
  // observed.
  optional int32 connections = 4;

  // JetStream streams in the account in the newest epoch; unset when not
  // observed.
  optional int32 streams = 5;

  // JetStream consumers in the account in the newest epoch; unset when not
  // observed.
  optional int32 consumers = 6;
}

// Request for the accounts of a system.
message ListAccountsRequest {
  // System ID, as ListSystems returns it. Empty means the default system.
  string system = 1;

  // Range whose newest epoch is read. Unset means the last 24 hours up to
  // now. A range without an epoch lists every account seen up to its
  // end, including accounts retired long before it, with every count
  // unset.
  TimeRange range = 2;
}

// Accounts, ordered by account.
message ListAccountsResponse {
  // The accounts.
  repeated Account accounts = 1;
}

// Request for what the shell of every page shows.
message GetShellStatusRequest {
  // System ID, as ListSystems returns it. Empty means the default system.
  // An unknown one is not an error: the response says so in system_known.
  string system = 1;

  // Range whose newest epoch gives the freshness and the servers. Unset
  // means the last two collect intervals up to now.
  TimeRange range = 2;
}

// Badge status of one system.
message SystemStatus {
  // The system.
  SystemRef system = 1;

  // Worst status of the findings that fire now; no data when the last 24
  // hours hold no epoch.
  Status status = 2;

  // What the system's collector is doing now.
  CollectionState collection = 3;

  // Whether the system's collector collects: false while its connection
  // fails or the stored data says it stopped.
  bool collecting = 4;

  // Why the status could not be read, for example a timeout; the other
  // fields except system are then unset. Empty when it was read.
  string error = 5;

  // Whether the status is still being read: the system's first summary
  // took longer than the call waits for it. The other fields except system
  // are then unset; a later call has it.
  bool pending = 6;
}

// What the shell shows: the system's freshness, servers and finding
// tally, and every system's badge status.
message GetShellStatusResponse {
  // How current the system's data is, over the request's range.
  Freshness freshness = 1;

  // Servers seen in the range, by name, as GetOverview lists them.
  repeated ServerSummary servers = 2;

  // Counts of findings, as GetOverview counts them.
  FindingTally tally = 3;

  // Every system with its status over the last 24 hours, in
  // configuration order.
  repeated SystemStatus systems = 4;

  // ID of the default system: the one a request with an empty system
  // reads.
  string default_system = 5;

  // Whether the request's system is configured. When false, freshness,
  // servers and tally are unset.
  bool system_known = 6;

  // Connect code of the failure of the system's part, for example
  // deadline_exceeded; empty when it was read. Freshness, servers and
  // tally are then unset, while the systems are still listed.
  string error_code = 7;

  // Why the system's part could not be read; empty when it was read.
  string error = 8;
}
