syntax = "proto3";

package natslens.v1;

import "google/protobuf/timestamp.proto";
import "natslens/v1/common.proto";
import "natslens/v1/findings.proto";

option go_package = "github.com/shadone/nats-lens/internal/gen/natslens/v1;natslensv1";

// Where an event came from.
enum EventSource {
  // Not set.
  EVENT_SOURCE_UNSPECIFIED = 0;
  // A NATS system event or JetStream advisory.
  EVENT_SOURCE_NATS = 1;
  // A Kubernetes event or pod phase change.
  EVENT_SOURCE_KUBERNETES = 2;
  // A finding transition written by the checks.
  EVENT_SOURCE_FINDING = 3;
  // The collector itself: a capture gap, a lost or restored connection.
  EVENT_SOURCE_COLLECTOR = 4;
}

// One event.
message Event {
  // Event ID, unique in the database.
  string id = 1;

  // When it happened: the payload's own time when it has one.
  google.protobuf.Timestamp time = 2;

  // When the collector received it.
  google.protobuf.Timestamp received_at = 3;

  // Where it came from.
  EventSource source = 4;

  // Normalized kind, for example consumer.deleted.
  string kind = 5;

  // Name to show, for example CONSUMER.DELETED.
  string type = 6;

  // Severity for colouring; unset for routine events.
  Severity severity = 7;

  // One line describing the event.
  string summary = 8;

  // Server the event names, when it names one.
  string server = 9;

  // Account the event concerns.
  string account = 10;

  // Stream the event concerns.
  string stream = 11;

  // Consumer the event concerns.
  string consumer = 12;

  // Connection name of the client that caused the event.
  string client_name = 13;

  // Address of the client that caused the event.
  string client_host = 14;

  // Disconnect, termination or other reason, when given.
  string reason = 15;

  // For a finding event: the finding and the transition.
  FindingTransition transition = 16;

  // Latest finding row returned by the source, separate from the recorded
  // transition. A synthetic reference-frame read can return frame-relative state.
  Finding finding = 17;

  // Findings this event most likely caused, for example the missing
  // durable a consumer.deleted raised.
  repeated Finding raised = 18;

  // The payload as JSON, user JWTs removed; empty in event lists.
  string raw = 19;

  // Readable name of the account, when known.
  string account_name = 20;

  // With fold_repeats: how many events this row stands for, at least 1.
  // A Kubernetes event counts the occurrences Kubernetes reported for it.
  // Zero without fold_repeats.
  int32 repeats = 21;

  // With fold_repeats: when the oldest event of the row happened; the
  // row's time is the newest. Unset without fold_repeats.
  google.protobuf.Timestamp first_time = 22;

  // Whether the event is routine: client churn, sampled acks, account
  // connection counts, an API audit record of a successful call that
  // changes nothing, or a connect or disconnect of a tooling client. Set
  // only when the request asks for hide_routine, fold_repeats,
  // histogram_buckets or include_facets.
  bool routine = 23;
}

// Request for events.
message ListEventsRequest {
  // Range to read. Unset means the last 24 hours up to now.
  TimeRange range = 1;

  // Sources to include. Empty means all; at most 10.
  repeated EventSource sources = 2;

  // Kinds to include, for example consumer.deleted. Empty means all; at
  // most 50.
  repeated string kinds = 3;

  // Only events that concern this entity.
  //
  // A stream matches its consumers' events too, a server the events it
  // reported, a connection the events of that client connection on that
  // server. A system entity matches every event.
  EntityRef entity = 4;

  // Only events whose client connection name equals this.
  string client_name = 5;

  // Largest number of events to return. Zero means 100; at most 1000.
  int32 page_size = 6;

  // Token from a previous response, to read older events with the same
  // filters.
  string page_token = 7;

  // System ID, as ListSystems returns it. Empty means the default system.
  string system = 8;

  // Leave out routine events; routine_hidden counts them and
  // routine_groups says what they were.
  bool hide_routine = 9;

  // Fold repeats: events with the same source, kind, server, account,
  // stream, consumer, client name and reason (and finding, for a finding
  // event; object, for a Kubernetes event), each at most 10 minutes
  // after the previous one, become one row that shows the newest, with
  // repeats and first_time set. Pages then hold rows, not events.
  bool fold_repeats = 10;

  // Number of histogram buckets over the range: 0 for none, at most 120.
  int32 histogram_buckets = 11;

  // Return the facets and total_unfiltered.
  bool include_facets = 12;
  // Exact retained event selection, at most 1000 unique positive decimal IDs.
  // It intersects the other predicates; missing IDs remain missing.
  repeated string selected_ids = 13;
  // Captured event membership. A known zero excludes all events.
  optional int64 event_read_id = 14;
}

// The count of events with one value of a dimension.
message EventFacet {
  // The dimension: "source" or "server".
  string dimension = 1;

  // The value: an EventSource name such as EVENT_SOURCE_NATS, or a
  // server name.
  string value = 2;

  // Number of events with this value.
  int32 count = 3;
}

// Routine events of one kind and client.
message RoutineGroup {
  // Text to show, for example "catalog-api short connections".
  string label = 1;

  // The events' kind.
  string kind = 2;

  // The events' client connection name; empty for none.
  string client_name = 3;

  // Number of events.
  int32 count = 4;
}

// Event counts of one histogram bucket.
message EventBucket {
  // Start of the bucket; it ends where the next one starts.
  google.protobuf.Timestamp start = 1;

  // Events of warning or critical severity that are not routine.
  int32 warning = 2;

  // Other events that are not routine.
  int32 notable = 3;

  // Routine events.
  int32 routine = 4;
}

// Events, newest first.
message ListEventsResponse {
  // The events of this page.
  repeated Event events = 1;

  // Token for the next, older page; empty on the last page.
  string next_page_token = 2;

  // Number of events that match the filters, across pages. With
  // fold_repeats it still counts events, not rows.
  int32 total_count = 3;

  // With hide_routine: number of routine events the filters matched and
  // left out.
  int32 routine_hidden = 4;

  // With include_facets: event counts per source and per server. Each
  // dimension counts the events that match every filter except its own:
  // the sources for "source", a server entity for "server". Largest
  // count first.
  repeated EventFacet facets = 5;

  // With hide_routine: the routine events left out, by kind and client,
  // largest first, at most 10.
  repeated RoutineGroup routine_groups = 6;

  // With histogram_buckets: event counts per bucket of the range, oldest
  // first, from every filter except hide_routine.
  repeated EventBucket histogram = 7;

  // With include_facets: number of events in the range, with no other
  // UI filter. Explicit selected IDs and event membership remain in force.
  int32 total_unfiltered = 8;
  // Acknowledged exact selection; preserves input order. Older servers lacking
  // these fields must not be treated as honoring the selection or boundary.
  repeated string selected_ids = 9;
  optional int64 event_read_id = 10;
}

// Request for one event.
message GetEventRequest {
  // Event ID.
  string id = 1;

  // System ID, as ListSystems returns it. Empty means the default system.
  string system = 2;
  optional int64 event_read_id = 3;
}

// One event with its payload.
message GetEventResponse {
  // The event, with raw set.
  Event event = 1;
  // Acknowledged event membership; absence means unsupported/unrequested.
  optional int64 event_read_id = 2;
}
