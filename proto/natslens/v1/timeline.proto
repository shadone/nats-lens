syntax = "proto3";

package natslens.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "natslens/v1/common.proto";
import "natslens/v1/events.proto";
import "natslens/v1/overview.proto";

option go_package = "github.com/shadone/nats-lens/internal/gen/natslens/v1;natslensv1";

// One check's states over the range.
message TimelineRow {
  // Stable row key: the check code, followed by a colon and the entity key
  // when the row is for one entity.
  string key = 7;

  // Check code.
  string check_code = 1;

  // Check name.
  string check_name = 2;

  // The check's configured severity.
  Severity severity = 3;

  // Entity the row is for; unset when the row covers every entity of the
  // check.
  EntityRef entity = 4;

  // Worst status per bucket, oldest first, one per bucket.
  repeated Status cells = 5;

  // Status at the end of the range.
  Status now = 6;
}

// One event placed on an event lane of the timeline.
message LaneEvent {
  // Stable ID of the lane item: the stored event's ID when there is one,
  // otherwise an ID derived from the source, kind and time.
  string id = 8;

  // When it happened.
  google.protobuf.Timestamp time = 1;

  // Where it came from.
  EventSource source = 2;

  // Normalized kind, for example node.drained, pod.killing,
  // deployment.rolled_out, stream.quorum_lost.
  string kind = 3;

  // Short label for a crowded lane, for example "nats-0 Killing".
  string short_label = 4;

  // Full label, for example "pod nats-0 Killing".
  string label = 5;

  // Severity for colouring; unset for routine events.
  Severity severity = 6;

  // ID of the stored event; empty when the lane item is not a stored
  // event.
  string event_id = 7;
  EntityRef entity = 9;
  // For finding transitions, the recorded finding identity and collection.
  // Zero/empty means the mapping is unavailable, not current-only evidence.
  string finding_id = 10;
  int64 transition_epoch = 11;
}

// Request for the status timeline.
message GetStatusTimelineRequest {
  // Range to cover. Unset means the last 24 hours up to now.
  TimeRange range = 1;

  // Width of one bucket. Unset means 15 minutes; at least one second, and
  // the range may hold at most 2000 buckets, the last one counted even when
  // partial.
  google.protobuf.Duration bucket = 2;

  // Only rows for this entity; unset gives one row per check for the whole
  // system.
  EntityRef entity = 3;

  // Whether to include checks that were OK in every bucket.
  bool include_ok = 4;

  // System ID, as ListSystems returns it. Empty means the default system.
  string system = 5;
  // Optional captured event membership boundary, including a known empty zero.
  // It does not pin check/configuration state or restore expired events.
  optional int64 event_read_id = 6;
}

// Per check, per bucket, the worst state, and the events to draw with it.
message GetStatusTimelineResponse {
  // Start of the first bucket.
  google.protobuf.Timestamp start = 1;

  // Width of one bucket.
  google.protobuf.Duration bucket = 2;

  // Number of buckets; every row has this many cells.
  int32 bucket_count = 3;

  // Rows: those not OK now first, then by severity and code.
  repeated TimelineRow rows = 4;

  // Kubernetes events in the range, oldest first: at most the newest 1000.
  repeated LaneEvent kubernetes = 5;

  // NATS advisories and finding transitions in the range worth drawing,
  // oldest first: at most the newest 1000 NATS events and the newest 1000
  // finding transitions.
  repeated LaneEvent nats = 6;

  // Spans to shade, oldest first.
  repeated TimeWindow windows = 7;

  // Whether the range held more NATS events for the lane than the 1000 in
  // nats.
  bool nats_truncated = 8;

  // Whether the range held more finding transitions than the 1000 in nats.
  bool finding_truncated = 9;

  // Whether the range held more Kubernetes events than the 1000 in
  // kubernetes.
  bool kubernetes_truncated = 10;
  // Boundary for ListFindingEpisodes after selecting this Timeline. Later
  // finding transitions are excluded; this is not a persistent database pin.
  int64 finding_read_epoch = 11;
  optional int64 event_read_id = 12;
  // Resolved query bounds, separate from the possibly partial last bucket.
  TimeRange range = 13;

  // The server, leader and client lanes (fields 14 to 22) are filled only
  // for the whole system: with an entity other than the system they are
  // empty and both captured flags false.

  // Server lane, oldest first: restarts seen in the collections (a new
  // process of a server name, first collected by the end of the range),
  // and the lame duck, shutdown, out-of-storage and server-removed events;
  // at most the newest 1000.
  repeated LaneEvent servers = 14;

  // Whether the range held more server lane items than the 1000 in
  // servers.
  bool servers_truncated = 15;

  // Leader lane, oldest first: meta, stream and consumer leader elections;
  // at most the newest 1000.
  repeated LaneEvent leaders = 16;

  // Whether the range held more leader elections than the 1000 in leaders.
  bool leaders_truncated = 17;

  // Client lane: client connection events counted per bucket, only the
  // buckets with any; oldest first. Counts are complete for the range, not
  // capped.
  repeated ClientLaneBucket clients = 18;

  // Whether any NATS system event (client, server and account events) is
  // stored from the start of the range, or 7 days before its end when that
  // is earlier, to its end, up to the event boundary, and system event
  // capture did not stop for the whole range (system_capture_gaps). False
  // means none was captured then, so the client lane and the server
  // lane's events cannot be read as quiet.
  bool system_events_captured = 19;

  // Whether any JetStream advisory is stored over the same span, up to the
  // event boundary, and nats-lens was running for some of the range.
  // False means none was captured then. A lost account connection alone
  // does not clear it: the stored events do not say whether other
  // account connections still captured.
  bool jetstream_events_captured = 20;

  // Spans of the range in which system events were not captured, oldest
  // first, clipped to the range and merged: nats-lens was not running
  // (collector.gap) or the system account connection was lost (from its
  // loss to its reconnect, or to the end of the range when it had not
  // reconnected).
  repeated TimeRange system_capture_gaps = 21;

  // Spans of the range in which JetStream advisories were not captured,
  // oldest first, clipped to the range: nats-lens was not running, or one
  // account connection was lost. Not merged across connections.
  repeated CaptureGap advisory_capture_gaps = 22;
}

// Client connection events of one bucket on the timeline's client lane:
// counts, not single events.
message ClientLaneBucket {
  // Bucket index, from the response's start.
  int32 index = 1;

  // Connects: client.connect events and the connects client.churn
  // summaries folded.
  int64 connects = 2;

  // Disconnects the client closed, client.churn summaries included.
  int64 closes = 3;

  // Disconnects for any other recorded reason than a client close or a
  // server shutdown: slow consumer, stale connection, authorization and
  // so on.
  int64 drops = 4;

  // Disconnects because the server shut down.
  int64 shutdowns = 5;

  // Failed client authentications (client.auth_error).
  int64 auth_errors = 6;

  // Disconnects without a recorded reason.
  int64 unknown_disconnects = 7;
}

// A span of a timeline in which events were not captured.
message CaptureGap {
  // The span, clipped to the timeline's range.
  TimeRange range = 1;

  // The connection that was lost, as nats-lens labels it (an account
  // connection's label); empty when nats-lens was not running.
  string connection = 2;
}
