syntax = "proto3";

package natslens.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "natslens/v1/common.proto";
import "natslens/v1/findings.proto";

option go_package = "github.com/shadone/nats-lens/internal/gen/natslens/v1;natslensv1";

// Request for what each stream keeps, what bounds it, and when the
// JetStream stores fill.
message GetCapacityRequest {
  // System ID, as ListSystems returns it. Empty means the default system.
  string system = 1;

  // Range whose newest epoch is read; growth covers the whole range.
  // Unset means the last 24 hours up to now.
  TimeRange range = 2;
}

// One server's JetStream file store in the epoch; in memory_stores, its
// memory store.
message ServerStore {
  // Server name.
  string server_name = 1;

  // Cluster the server reports; empty when it reports none.
  string cluster = 2;

  // Whether the server's JSZ answered in the epoch. False: "not reported
  // in this collection", and used and limit are unset.
  bool reported = 3;

  // File store in use, bytes; unset when not reported.
  optional int64 used = 4;

  // File store limit (max_file_store), bytes; unset when not reported or
  // reported as 0 (no limit reported).
  optional int64 limit = 5;

  // Growth of the file store in use over the range, bytes per day, by
  // Theil-Sen (RobustPerDay); unset under 6 hours of data and when not
  // reported. May be negative.
  optional double per_day = 6;

  // Days until used reaches limit at per_day; set only when per_day is
  // above 0 and limit and used are known.
  optional double days_to_full = 7;

  // The firing finding of the server's store: server-014, else server-007;
  // empty when neither fires.
  string finding_id = 8;

  // Check code of that finding.
  string finding_code = 9;

  // Severity of that finding.
  Severity finding_severity = 10;

  // For server-014, the check's own days until full (its value), which
  // uses the check's rule and not per_day; unset otherwise.
  optional double finding_days = 11;
}

// What a stream row is.
enum CapacityStreamKind {
  // Not set.
  CAPACITY_STREAM_KIND_UNSPECIFIED = 0;
  // A stream.
  CAPACITY_STREAM_KIND_STREAM = 1;
  // A KV bucket: a stream named KV_<bucket>.
  CAPACITY_STREAM_KIND_KEY_VALUE = 2;
  // An object store: a stream named OBJ_<store>.
  CAPACITY_STREAM_KIND_OBJECT_STORE = 3;
}

// Which limit a stream reaches next.
enum NextLimitKind {
  // Not set.
  NEXT_LIMIT_KIND_UNSPECIFIED = 0;
  // No limit is set: the stream grows until the store is full.
  NEXT_LIMIT_KIND_NONE = 1;
  // The stream holds no messages.
  NEXT_LIMIT_KIND_EMPTY = 2;
  // max_age (a bucket's TTL).
  NEXT_LIMIT_KIND_AGE = 3;
  // max_msgs.
  NEXT_LIMIT_KIND_MESSAGES = 4;
  // max_bytes.
  NEXT_LIMIT_KIND_BYTES = 5;
  // max_msgs_per_subject, the only limit set (a bucket's history).
  NEXT_LIMIT_KIND_PER_SUBJECT = 6;
  // The JetStream limit of the stream's account for the stream's storage
  // (account_limit), shared by every stream of the account: days is the
  // account's days to full (AccountStore), not a forecast of the stream
  // alone. An account at 99% of its limit or more is the next limit of
  // every stream of that storage, refusing (nats-server refuses each new
  // message of an account at its limit, whatever the stream's own limits
  // and discard policy). Otherwise chosen when the stream has no age,
  // message or byte limit, or when the account fills before the stream
  // reaches its own; never over a limit the stream holds at now (steady
  // or refusing) or an empty stream. discard_new is true.
  NEXT_LIMIT_KIND_ACCOUNT = 7;
}

// Where a stream stands against its next limit.
enum NextLimitState {
  // Not set: the limit is none or empty.
  NEXT_LIMIT_STATE_UNSPECIFIED = 0;
  // The limit is reached and the stream drops its oldest messages: the
  // oldest message is at 95% of max_age or more, or messages or bytes at
  // 99% of max_msgs or max_bytes or more with discard old.
  NEXT_LIMIT_STATE_STEADY = 1;
  // max_msgs or max_bytes is reached (99% or more) with discard new: the
  // stream refuses new messages.
  NEXT_LIMIT_STATE_REACHED_REFUSING = 2;
  // The limit is reached in days at the current growth (for age, when the
  // oldest message reaches max_age).
  NEXT_LIMIT_STATE_REACHES = 3;
  // Limits are set and none has a forecast: the stream does not grow
  // towards them, or its growth is unknown.
  NEXT_LIMIT_STATE_NOT_REACHED = 4;
  // Only a per-subject limit is set; nats-lens does not see per-subject
  // counts.
  NEXT_LIMIT_STATE_NOT_FORECAST = 5;
}

// The limit a stream reaches next and when.
message NextLimit {
  // Which limit.
  NextLimitKind limit = 1;

  // Where the stream stands against it.
  NextLimitState state = 2;

  // Days until the limit is reached; set only when state is reaches.
  optional double days = 3;

  // Whether the stream discards new messages at the limit (discard new),
  // so that reaching it refuses messages. False for age, which always
  // removes the oldest.
  bool discard_new = 4;
}

// What the Capacity page says of a stream.
enum CapacityStatus {
  // Not set.
  CAPACITY_STATUS_UNSPECIFIED = 0;
  // stream-006 fires: the stream reaches its byte limit soon.
  CAPACITY_STATUS_FILLS_SOON = 1;
  // stream-005 fires under an acceptance as by design.
  CAPACITY_STATUS_ACCEPTED = 2;
  // Unbounded and stream-005 does not fire because the inventory declares
  // the stream unbounded, or lists the KV bucket with allow_msg_ttl; see
  // declared_reason.
  CAPACITY_STATUS_DECLARED = 3;
  // stream-005 fires under a mute.
  CAPACITY_STATUS_MUTED = 4;
  // stream-005 fires, neither muted nor accepted.
  CAPACITY_STATUS_AWAITING_DECISION = 5;
  // No limit, not declared, and no stream-005 finding (the check is
  // turned off, or did not run in the epoch).
  CAPACITY_STATUS_UNBOUNDED = 6;
  // Any other stream.
  CAPACITY_STATUS_BOUNDED = 7;
}

// One stream, KV bucket or object store in the epoch, with ListStreams'
// numbers: its leader's report, else the largest any server reports.
message CapacityStream {
  // Account as the servers report it.
  string account = 1;

  // Readable name of the account; empty when none is known.
  string account_name = 2;

  // Stream name.
  string stream = 3;

  // Stream, KV bucket or object store, by the name's prefix.
  CapacityStreamKind kind = 4;

  // Retention policy: limits, interest or workqueue; empty when not
  // reported.
  string retention = 5;

  // Storage: file or memory; empty when not reported.
  string storage = 6;

  // Replicas configured.
  int32 replicas = 7;

  // Stream this stream mirrors; empty when not a mirror.
  string mirror = 8;

  // Streams this stream sources from.
  int32 sources = 9;

  // Messages held; unset when not reported.
  optional int64 messages = 10;

  // Bytes held, one copy; unset when not reported.
  optional int64 bytes = 11;

  // A KV bucket's keys (distinct subjects); unset for other kinds or when
  // not reported.
  optional int64 keys = 12;

  // Time of the oldest message held; unset when the stream is empty or it
  // was not reported.
  google.protobuf.Timestamp first_ts = 13;

  // Limits, each set only when the stream sets it (above 0); unset means
  // no limit.
  optional int64 max_msgs = 14;
  optional int64 max_bytes = 15;
  // max_age, a bucket's TTL.
  google.protobuf.Duration max_age = 16;
  // A KV bucket's history per key.
  optional int64 max_msgs_per_subject = 17;

  // Discard policy at a limit: old or new; empty when not reported.
  string discard = 18;

  // Whether the stream allows per-message TTLs.
  bool allow_msg_ttl = 19;

  // Growth of bytes over the range, one copy, bytes per day: the same
  // number as ListStreams' bytes_per_day. Unset under 6 hours of data.
  optional double bytes_per_day = 20;

  // Growth of messages over the range, messages per day; unset as
  // bytes_per_day.
  optional double msgs_per_day = 21;

  // The limit the stream reaches next.
  NextLimit next_limit = 22;

  // What the page says of the stream's bounds.
  CapacityStatus status = 23;

  // The finding behind the status: stream-006 for fills soon, stream-005
  // for accepted, muted and awaiting a decision; empty otherwise.
  string finding_id = 24;

  // For stream-006, the check's own days until max_bytes (its value);
  // unset otherwise.
  optional double finding_days = 25;

  // The mute or acceptance in force on that finding; unset when none.
  Mute mute = 26;

  // Why a declared stream is unbounded on purpose: "inventory" (the
  // inventory declares it with max_age 0 and max_bytes -1) or
  // "writer_ttls" (a KV bucket the inventory lists that allows per-message
  // TTLs); empty unless status is declared.
  string declared_reason = 27;

  // The JetStream limit the account JWT sets for the stream's storage
  // (file or memory), bytes counted over replicas, shared by every stream
  // of the account: the limit of the matching AccountStore. Unset when the
  // account has no JWT, or its limit is -1 (none) or 0 (none allowed).
  optional int64 account_limit = 28;
}

// One account's JetStream limit for one storage, as the account JWT sets
// it in operator mode, against the account's use.
message AccountStore {
  // Account as the servers report it.
  string account = 1;

  // Readable name of the account; empty when none is known.
  string account_name = 2;

  // "file" (the JWT's disk limit) or "memory".
  string storage = 3;

  // In use, bytes counted over replicas: the largest any server reports
  // for the account in the epoch (each reports the account total), as the
  // Accounts page reads it. Unset when no server reported the account.
  optional int64 used = 4;

  // The JWT's limit, bytes, above 0.
  int64 limit = 5;

  // Growth of used over the range, bytes per day, by Theil-Sen
  // (RobustPerDay) over the largest report of each collection; unset under
  // 6 hours of data or when used is unset. May be negative.
  optional double per_day = 6;

  // Days until used reaches limit at per_day; set only when per_day is
  // above 0 and used is known.
  optional double days_to_full = 7;
}

// What each stream keeps and what bounds it, and how full each server's
// JetStream file store is and when it fills, in the range's newest epoch.
message GetCapacityResponse {
  // Epoch read; 0 when the range holds none, and then everything else is
  // empty.
  int64 epoch = 1;

  // When the epoch started.
  google.protobuf.Timestamp epoch_at = 2;

  // One card per server the epoch expected that has JetStream enabled
  // (or did not answer): grouped by cluster in name order, then the
  // soonest full first, then the fullest, then by name.
  repeated ServerStore servers = 3;

  // Servers the epoch expected that answered without JetStream.
  int32 servers_without_jetstream = 4;

  // Streams: those whose stream-006 fires unmuted first (soonest first),
  // then those awaiting a decision, then those whose stream-006 fires
  // under a mute, then the others by bytes times replicas, most first,
  // then by account and name. At most 500.
  repeated CapacityStream streams = 5;

  // Streams before the limit of 500.
  int32 streams_total = 6;

  // The first collection the growth reads: the range's start or, when the
  // history is shorter, the first stored collection. Unset when no epoch.
  google.protobuf.Timestamp growth_from = 7;

  // One card per server's JetStream memory store, for the same servers as
  // servers and in the same order: used and limit from the memory store
  // (max_memory_store), growth and days to full by the same rule. The
  // finding fields are empty: server-007 reads both stores and its finding
  // is on the file store card. Empty unless a reported server holds memory
  // in use above 0 or a stream of the epoch uses memory storage.
  repeated ServerStore memory_stores = 8;

  // One card per account and storage whose account JWT sets a JetStream
  // limit above 0, from the account's newest lookup no older than the
  // Accounts page reads: the soonest full first (as the card words it),
  // then the fullest, then by account and storage (file first).
  repeated AccountStore account_stores = 9;
}
