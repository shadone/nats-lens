syntax = "proto3";

package natslens.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "natslens/v1/common.proto";

option go_package = "github.com/shadone/nats-lens/internal/gen/natslens/v1;natslensv1";

// Request for the client applications of a system: the connections of the
// range's newest epoch grouped by application.
message GetApplicationsRequest {
  // System ID, as ListSystems returns it. Empty means the default system.
  string system = 1;

  // Range whose newest epoch is read. Unset means the last 24 hours up to
  // now.
  TimeRange range = 2;

  // Account the page is scoped to, as the servers report it ($G for the
  // global account); empty for every account.
  string account = 3;

  // Also list the tooling connections (see Connection.tooling); they are
  // left out otherwise and counted in tooling_hidden.
  bool include_tooling = 4;
}

// Connections of an application on one server.
message ServerCount {
  // Server name.
  string server = 1;

  // The application's connections on it.
  int32 connections = 2;
}

// Connections of an application that use one client library version.
message LibraryCount {
  // Client library language, for example go or nats.js; empty when not
  // reported.
  string lang = 1;

  // Client library version; empty when not reported.
  string version = 2;

  // Connections that report it.
  int32 connections = 3;
}

// An account an application's connections use.
message ApplicationAccount {
  // Account as the servers report it; $G for a connection without one.
  string account = 1;

  // Readable name of the account; empty when none is known.
  string account_name = 2;
}

// A client finding that fires for an application.
message FindingRef {
  // Finding ID, as GetFinding takes it.
  string id = 1;

  // Check code, for example client-004.
  string check_code = 2;

  // Check name.
  string check_name = 3;

  // Current severity.
  Severity severity = 4;

  // Whether a mute or an acceptance applies.
  bool muted = 5;

  // The finding's entity key: the application (client-001) or one of its
  // connection names (client-002 to client-005).
  string entity_key = 6;
}

// An application's traffic in one hour.
message HourTraffic {
  // Start of the hour.
  google.protobuf.Timestamp hour = 1;

  // Messages and bytes the application's connections sent to the servers
  // (in) and the servers delivered to them (out) in the hour, from the
  // hourly rollup; unset when no collection of the hour measured a
  // connection of the application.
  optional int64 in_msgs = 2;
  optional int64 out_msgs = 3;
  optional int64 in_bytes = 4;
  optional int64 out_bytes = 5;
}

// One client application: the connections of the epoch whose name is the
// same before the first "@".
message Application {
  // The connection name before the first "@"; (unnamed) for a connection
  // without a name or with nothing before the "@".
  string name = 1;

  // Connections of the epoch.
  int32 connections = 2;

  // Instances: the distinct pods (the name between the first "@" and the
  // next) of the connections whose name gives one, plus one per
  // connection (server and connection ID) whose name gives none.
  int32 instances = 3;

  // The pod names, sorted, at most 10.
  repeated string pods = 4;

  // Distinct pod names, before the limit of 10.
  int32 pods_total = 5;

  // The servers the connections are on, most connections first, then by
  // name.
  repeated ServerCount servers = 6;

  // The accounts the connections use, sorted.
  repeated ApplicationAccount accounts = 7;

  // The client library versions, most connections first, then by language
  // and version; more than one is mixed. Connections that report neither
  // language nor version are left out.
  repeated LibraryCount libraries = 8;

  // Median round trip time over the connections that report one (the mean
  // of the middle two of an even count); unset when none does.
  google.protobuf.Duration rtt_p50 = 9;

  // Subscriptions, summed over the connections that report them; unset
  // when none does.
  optional int64 subscriptions = 10;

  // Bytes waiting to be written to the connections, summed, and the
  // largest of one connection; unset when none reports it.
  optional int64 pending_bytes = 11;
  optional int64 pending_bytes_max = 12;

  // Reconnects in the 24 hours before the epoch by client-004's rule,
  // summed over the application's connection names: per name, the
  // smaller of the disconnects for a reason other than "Client Closed"
  // and "Server Shutdown", and the connects (those folded into
  // client.churn events included). A drop under one name and a connect
  // under another, as in a rolling deploy, do not pair. Unset when no
  // event was captured up to the epoch.
  optional int32 reconnects_24h = 13;

  // Disconnects in the same 24 hours whose reason contains "slow
  // consumer" (client-003); unset when no event was captured.
  optional int32 slow_consumers_24h = 14;

  // Disconnects in the same 24 hours with the reason "Stale Connection";
  // unset when no event was captured.
  optional int32 stale_24h = 15;

  // Connects folded into client.churn events in the same 24 hours, each
  // closed by the client within seconds (client-005); unset when no event
  // was captured.
  optional int32 short_lived_24h = 16;

  // The client findings firing at the epoch whose entity key is the
  // application or one of its connection names (also a name seen only in
  // events): unmuted first, then by severity, worst first, then by check
  // code.
  repeated FindingRef findings = 17;

  // The 24 whole hours before the hour of the epoch, oldest first.
  repeated HourTraffic traffic = 18;

  // Sums over the hours of traffic that are set; unset when none is.
  optional int64 in_msgs_24h = 19;
  optional int64 out_msgs_24h = 20;
  optional int64 in_bytes_24h = 21;
  optional int64 out_bytes_24h = 22;

  // Whether every connection of the application is tooling; listed only
  // with include_tooling.
  bool tooling = 23;

  // The client addresses of the connections, sorted, at most 10.
  repeated string addresses = 24;

  // Distinct client addresses, before the limit of 10.
  int32 addresses_total = 25;
}

// How the listed connections spread over the servers.
message ApplicationSpread {
  // The server with the most connections of the applications in the
  // scope; the first by name of a tie. Empty without a connection.
  string server = 1;

  // Its connections, and those of every server.
  int32 connections = 2;
  int32 total = 3;

  // Servers with a connection of the applications.
  int32 servers = 4;

  // Whether the server holds more than half of the connections and the
  // applications use more than one server: a restart of it moves most
  // clients at once. False on a partial epoch, whose missing servers'
  // connections are not known.
  bool concentrated = 5;
}

// A client library version and the applications that use it.
message LibraryUse {
  // Client library language; empty when not reported.
  string lang = 1;

  // Client library version; empty when not reported.
  string version = 2;

  // Applications with a connection that reports it.
  int32 applications = 3;
}

// The 24-hour counts over the applications in the scope.
message ApplicationsLastDay {
  // Slow consumer disconnects and stale connections, summed over the
  // applications; unset when no event was captured up to the epoch.
  optional int32 slow_consumers = 1;
  optional int32 stale = 2;

  // Applications with at least one reconnect; unset when no event was
  // captured.
  optional int32 reconnecting = 3;
}

// The client applications of the range's newest epoch.
message GetApplicationsResponse {
  // Epoch read; 0 when the range holds none, and then everything else is
  // empty.
  int64 epoch = 1;

  // When the epoch started.
  google.protobuf.Timestamp epoch_at = 2;

  // Applications: those with an unmuted finding first, then by
  // connections, most first, then by name. At most 500.
  repeated Application applications = 3;

  // Applications before the limit of 500.
  int32 applications_total = 4;

  // Connections of the applications, before the limit.
  int32 connections_total = 5;

  // Tooling connections in the scope left out because include_tooling is
  // false.
  int32 tooling_hidden = 6;

  // How the connections spread over the servers, over every application
  // before the limit.
  ApplicationSpread spread = 7;

  // Client library versions by the applications that use them, most
  // applications first, then by language and version; over every
  // application before the limit. A connection that reports neither
  // language nor version counts for none.
  repeated LibraryUse libraries = 8;

  // The 24-hour counts, over every application before the limit.
  ApplicationsLastDay last_day = 9;

  // Whether a server's connection list in the epoch was cut at the
  // collector's connz limit: its other connections are not counted.
  bool connz_cut = 10;

  // Whether any event was captured up to the epoch; the 24-hour counts
  // are unset when not.
  bool events_captured = 11;

  // Whether the epoch is partial: a server or an endpoint did not answer.
  // The connections of a server that did not answer are not counted, so
  // spread.concentrated is false.
  bool partial = 12;

  // Servers the epoch expected that did not answer, sorted, as
  // ListServers names them.
  repeated string missing = 13;

  // Whether event capture, while it ran, stopped for part of the 24 hours
  // before the epoch (nats-lens stopped, or a connection that captures
  // events was lost), as on the Accounts and auth page: the 24-hour
  // counts are then lower bounds. False when events_captured is false.
  bool capture_gaps = 14;
}
