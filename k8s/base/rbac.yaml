# Read-only access for the Kubernetes watcher (kubernetes.enabled): Events
# and pods in the NATS namespace (nats here; patch the Role and RoleBinding
# for another), Events of nodes (filed in default), and nodes. natslens
# never writes to the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: natslens-read
  namespace: nats
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: natslens-read
  namespace: nats
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: natslens-read
subjects:
  - kind: ServiceAccount
    name: natslens
    namespace: nats-lens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: natslens-node-events
  namespace: default
rules:
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: natslens-node-events
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: natslens-node-events
subjects:
  - kind: ServiceAccount
    name: natslens
    namespace: nats-lens
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: natslens-nodes
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: natslens-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: natslens-nodes
subjects:
  - kind: ServiceAccount
    name: natslens
    namespace: nats-lens
