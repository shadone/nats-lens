# The DuckDB file and the hourly Parquet archive. One volume holds both,
# so losing it loses the history. It uses the cluster's default storage
# class. 5Gi suits a small cluster; for a production cluster with 90 days of
# archive, 20Gi or more (see docs/deploy.md, Volume size).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: natslens-data
  namespace: nats-lens
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
