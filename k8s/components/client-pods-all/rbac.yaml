# Read-only access to the pods of every namespace. natslens lists and
# watches them; it never writes to the API server.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: natslens-client-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: natslens-client-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: natslens-client-pods
subjects:
  - kind: ServiceAccount
    name: natslens
    namespace: nats-lens
