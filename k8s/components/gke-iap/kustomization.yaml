apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# natslens on GKE behind IAP: IAP and the load balancer's health check for
# the Service, a NetworkPolicy that admits only Google's load balancer and
# the Managed Prometheus collectors, and a PodMonitoring that scrapes
# /metrics. Needs the GKE Gateway and Managed Prometheus CRDs.
resources:
  - gcp-policies.yaml
  - networkpolicy.yaml
  - podmonitoring.yaml
