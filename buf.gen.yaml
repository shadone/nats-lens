# Generates the Go server code into internal/gen and the TypeScript client
# code into web/src/gen. The Go plugins run through the tool directives in
# go.mod; protoc-gen-es comes from web/node_modules (npm ci in web/ first).
version: v2
clean: true
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: internal/gen
    opt: paths=source_relative
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
